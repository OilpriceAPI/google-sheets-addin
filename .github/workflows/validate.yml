name: Validate reference implementation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "29 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run assets
      - run: npm run validate
      - name: Report scheduled validation failure
        if: ${{ failure() && github.event_name == 'schedule' }}
        run: |
          echo "::error title=Weekly Sheets add-in validation failed::Review the failed gate and dependency audit in this workflow run."
          {
            echo "## Weekly Sheets add-in validation failed"
            echo
            echo "Review the failing step, reproduce with \`npm ci && npm audit --audit-level=moderate && npm run assets && npm run validate\`, and patch or suppress only with documented evidence."
            echo
            echo "[Open this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          } >> "$GITHUB_STEP_SUMMARY"
